name: Altius Newspaper Daily Ingestion

on:
  schedule:
    # Runs every 3 hours from 06:00 IST to 21:00 IST daily
    # 06:00 IST = 00:30 UTC
    # 09:00 IST = 03:30 UTC
    # 12:00 IST = 06:30 UTC
    # 15:00 IST = 09:30 UTC
    # 18:00 IST = 12:30 UTC
    # 21:00 IST = 15:30 UTC
    - cron: '30 0,3,6,9,12,15 * * *'
  workflow_dispatch:

# Prevent overlapping ingestion runs
concurrency:
  group: newspaper-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    name: Polling & Ingestion Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Newspaper Ingestion Worker
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
        run: npx tsx scripts/ingest-newspapers.mjs
